toolId: test-runner
actions:
  - actionId: run_targeted_tests
    riskClass: R2
    sideEffect: local_write
    reversible: true
    requiresHITL: false
    requiresPreparedAction: false
    rollbackPolicyRef: docs_zh/governance/rollback-policies/engineering-change-rollback.md
    dataClassesTouched:
      - test_results
    allowedFamilies:
      - engineering
    mitigations:
      - isolated_test_workspace
  - actionId: analyze_failure
    riskClass: R1
    sideEffect: none
    reversible: true
    requiresHITL: false
    requiresPreparedAction: false
    rollbackPolicyRef: docs_zh/governance/rollback-policies/engineering-change-rollback.md
    dataClassesTouched:
      - test_results
    allowedFamilies:
      - engineering
    mitigations:
      - non_executing_analysis
